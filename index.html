<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baron Minker — AR Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script type="module" src="assets/vendor/model-viewer.min.js"></script>
</head>
<body>

<div class="wrap">
  <p class="kicker">Baron Minker</p>
  <h1>AR Character Gallery</h1>
  <p class="sub">Self-hosted 3D characters, viewable in augmented reality straight from your phone. Tap a character, or scan a code from the <a href="print.html" style="color:var(--salmon); font-weight:600;">printed sheet</a>.</p>

  <div class="grid" id="grid"></div>

  <div class="footer-links">
    <a href="print.html">Open the printable QR sheet →</a>
  </div>
</div>

<script>
async function init(){
  const res = await fetch('data/models.json');
  const models = await res.json();
  const grid = document.getElementById('grid');

  const byCharacter = new Map();
  for(const m of models){
    if(!byCharacter.has(m.name)) byCharacter.set(m.name, []);
    byCharacter.get(m.name).push(m);
  }

  for(const [name, variants] of byCharacter){
    const preview = variants.find(v => /idle/i.test(v.variant)) || variants[0];

    const card = document.createElement('a');
    card.className = 'card';
    card.href = variants.length > 1
      ? `character.html?name=${encodeURIComponent(name)}`
      : `viewer.html?model=${encodeURIComponent(preview.id)}`;

    const mv = document.createElement('model-viewer');
    mv.src = `assets/models/${preview.file}`;
    mv.setAttribute('camera-controls', '');
    mv.setAttribute('disable-zoom', '');
    mv.setAttribute('auto-rotate', '');
    mv.setAttribute('rotation-per-second', '18deg');
    mv.setAttribute('autoplay', '');
    mv.setAttribute('shadow-intensity', '0.8');
    mv.setAttribute('exposure', '1');
    mv.setAttribute('loading', 'lazy');

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `
      <div class="card-name">${name}</div>
      <div class="card-variant">${variants.length > 1 ? `${variants.length} animations` : (preview.variant || '')}</div>
      <div class="card-link">${variants.length > 1 ? 'Browse animations →' : 'View in AR →'}</div>
    `;

    card.appendChild(mv);
    card.appendChild(body);
    grid.appendChild(card);
  }
}
init();
</script>

</body>
</html>
